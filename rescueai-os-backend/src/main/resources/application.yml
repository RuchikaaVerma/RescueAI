server:
  port: 8081

spring:
  application:
    name: rescueai-os-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rescueai_os}
    username: ${DB_USER:rescueai}
    password: ${DB_PASSWORD:rescueai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate auto-DDL
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- AI provider config -----------------------------------------------------
  # Phase 1 default: OpenAI-compatible endpoint. Point base-url at Gemini's
  # OpenAI-compatibility layer, or at OpenAI directly, purely via env vars —
  # no code change. Phase 2: switch `rescueai.ai.provider` to `ollama` to run
  # Gemma/Llama/Mistral/DeepSeek/Phi locally instead.
  ai:
    openai:
      api-key: ${AI_API_KEY:changeme}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.3
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3}

rescueai:
  ai:
    provider: ${AI_PROVIDER:openai}   # openai | ollama
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.rescueai.os: INFO
    org.springframework.ai: DEBUG
